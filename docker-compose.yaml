services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - BACKEND_SERVER_HOST=${BACKEND_SERVER_HOST:-0.0.0.0}
      - BACKEND_SERVER_PORT=${BACKEND_SERVER_PORT:-3000}
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@postgres:5432/ticketing
      - REDIS_URL=${REDIS_URL:?REDIS_URL}
      - SIGNING_SECRET=${SIGNING_SECRET:?SIGNING_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY}
      - STRIPE_ENDPOINT_SECRET=${STRIPE_ENDPOINT_SECRET:?STRIPE_ENDPOINT_SECRET}
      - RESEND_SECRET_KEY=${RESEND_SECRET_KEY:?RESEND_SECRET_KEY}
    depends_on:
      prisma-db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: node dist/worker.js
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:?POSTGRES_USER}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}@postgres:5432/ticketing
      - REDIS_URL=${REDIS_URL:?REDIS_URL}
      - SIGNING_SECRET=${SIGNING_SECRET:?SIGNING_SECRET}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY}
      - RESEND_SECRET_KEY=${RESEND_SECRET_KEY:?RESEND_SECRET_KEY}
    healthcheck:
      disable: true
    depends_on:
      prisma-db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      prisma:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD}
      POSTGRES_DB: ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data: